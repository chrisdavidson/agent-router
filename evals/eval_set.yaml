     tool_input: {url: "https://example.com/changelog.html", prompt: "list the latest changes"}}

  # ---------------------------------------------------------------- context (multi-turn)
  # The current step decides; the recent prompts are misleading or distracting.
  - {id: ctx-1, split: cal, point: prompt, expected: none,
     text: "kick off the whole test suite and tell me what fails",
     recent: ["pull the name field out of every entry in customers.json"]}
  - {id: ctx-2, split: test, point: prompt, expected: none,
     text: "explain what the retry helper in src/ does",
     recent: ["in inventory.json, which products have fewer than 5 units in stock"]}
  - {id: ctx-3, split: cal, point: tool, expected: none,
     text: "make sure nothing broke", tool_name: Bash, tool_input: {command: "pytest -q"},
     recent: ["turn the saved docs/index.html page into a markdown file"]}
  - {id: ctx-4, split: test, point: tool, expected: none,
     text: "run the tests again", tool_name: Bash, tool_input: {command: "pytest -q"},
     recent: ["strip the tags out of landing.html and hand me clean markdown"]}
  - {id: ctx-5, split: cal, point: prompt, expected: exact-calc,
     text: "give me 7 to the 31st power with every digit",
     recent: ["convert the faq.html export to markdown",
              "what's the total size of this repository broken down by file type"]}
  - {id: ctx-6, split: test, point: prompt, expected: exact-calc,
     text: "I need 3**150 written out in full, no scientific notation",
     recent: ["change about.html into a markdown document",
