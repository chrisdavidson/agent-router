     tool_input: {command: "sed -e 's/<[^>]*>//g' index.html"}}
  - {id: html-t4, split: cal, point: tool, expected: html-to-markdown,
     text: "", tool_name: Bash,
     tool_input: {command: "python3 -c \"import html2text; print(html2text.html2text(open('faq.html').read()))\""}}
  - {id: html-t5, split: test, point: tool, expected: html-to-markdown,
     text: "read pricing.html as plain text", tool_name: Bash,
