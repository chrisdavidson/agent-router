     recent: ["multiply 9,871 by 4,409 and give me the exact result"]}
  - {id: ctx-8, split: test, point: prompt, expected: json-query,
     text: "from settings.json, what timeout values are configured under services",
     recent: ["what is 12.5% of 18,400 exactly"]}
  - {id: ctx-9, split: cal, point: prompt, expected: none,
     text: "rename the helper function to fetch_with_retry everywhere",
     recent: ["divide 7,340,221 by 17 and keep it exact"]}
  - {id: ctx-10, split: test, point: prompt, expected: none,
     text: "split the payment service class into smaller modules",
     recent: ["which users in accounts.json have an expired plan",
              "turn changelog.html into markdown"]}
