  - {id: html-t6, split: cal, point: tool, expected: html-to-markdown,
     text: "what does the saved coverage html page say", tool_name: Read,
     tool_input: {file_path: "out/coverage/index.html"}}

  # ---------------------------------------------------------------- repo-stats
  - {id: repo-p1, split: test, point: prompt, expected: repo-stats,
