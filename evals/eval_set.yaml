# agent-router labelled eval set.
#
# Written independently of catalog.yaml `examples` / `native_examples` (tests/test_eval.py
# checks there is no near-copy). Each case is one agent step:
#   text       the user's prompt (at tool/skill points: the prompt of the turn, may be empty)
#   point      prompt | tool | skill
#   tool_name  native tool about to run (tool: Bash/Read/Glob/WebFetch, skill: Skill)
#   tool_input its input
#   expected   catalog entry id, or `none` when the agent's own tools are enough
#   decoy      true for near-misses that must stay `none`
#   split      cal (used by `agent-router calibrate`) | test (holdout; metrics are reported here)
#   recent     earlier prompts of the same session (optional; the router appends up to 3 of
#              them to the state as "previous: ..." lines)
# Splits alternate inside each group (entry x point, negatives, decoys) so the holdout covers
# every entry at every point it is eligible for.
version: "2026-09-26.1"

cases:
  # ---------------------------------------------------------------- exact-calc
  - {id: calc-p1, split: cal, point: prompt, expected: exact-calc,
     text: "what does 3 to the power of 45 come out to, every digit"}
  - {id: calc-p2, split: test, point: prompt, expected: exact-calc,
     text: "multiply 48,213,907 by 7,302,118 and give me the exact product"}
  - {id: calc-p3, split: cal, point: prompt, expected: exact-calc,
     text: "reduce 1071/462 to lowest terms"}
  - {id: calc-p4, split: test, point: prompt, expected: exact-calc,
     text: "what's a 15 percent tip on an $86.40 bill"}
  - {id: calc-p5, split: cal, point: prompt, expected: exact-calc,
     text: "work out the least common multiple of 84 and 360"}
  - {id: calc-p6, split: test, point: prompt, expected: exact-calc,
     text: "evaluate 30! / (27! * 3!) without rounding"}
  - {id: calc-p7, split: cal, point: prompt, expected: exact-calc,
     text: "if I put $2,500 away at 4.2% compounded yearly, what is it worth after 12 years"}
  - {id: calc-p8, split: test, point: prompt, expected: exact-calc,
     text: "square root of 1764, and is it an integer"}
  - {id: calc-t1, split: test, point: tool, expected: exact-calc,
     text: "how big is 2^64", tool_name: Bash,
     tool_input: {command: "python3 -c 'print(2**64)'"}}
  - {id: calc-t2, split: cal, point: tool, expected: exact-calc,
     text: "", tool_name: Bash,
     tool_input: {command: "echo $((7919 * 104729))"}}
  - {id: calc-t3, split: test, point: tool, expected: exact-calc,
     text: "exact value of 1/3 + 1/6", tool_name: Bash,
     tool_input: {command: "python3 -c \"from fractions import Fraction as F; print(F(1,3)+F(1,6))\""}}
  - {id: calc-t4, split: cal, point: tool, expected: exact-calc,
     text: "what's the remainder when 1234567 is divided by 97", tool_name: Bash,
     tool_input: {command: "echo '1234567 % 97' | bc"}}
  - {id: calc-t5, split: test, point: tool, expected: exact-calc,
     text: "what is 2 to the 100th", tool_name: Bash,
     tool_input: {command: "node -e 'console.log(2n**100n)'"}}
  - {id: calc-t6, split: cal, point: tool, expected: exact-calc,
     text: "divide 355 by 113", tool_name: Bash,
     tool_input: {command: "awk 'BEGIN{print 355/113}'"}}

