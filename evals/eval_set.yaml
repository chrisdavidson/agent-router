  - {id: neg-p5, split: test, point: prompt, expected: none,
     text: "debug why the websocket connection drops after 60 seconds"}
  - {id: neg-p6, split: cal, point: prompt, expected: none,
     text: "delete the unused imports in app.py"}
  - {id: neg-p7, split: test, point: prompt, expected: none,
     text: "write a dockerfile for this flask app"}
  - {id: neg-p8, split: cal, point: prompt, expected: none,
     text: "translate this error message into spanish"}
  - {id: neg-p9, split: test, point: prompt, expected: none,
     text: "migrate the database schema to add a created_at column"}
  - {id: neg-p10, split: cal, point: prompt, expected: none,
     text: "explain the big-O of quicksort in the worst case"}
  - {id: neg-p11, split: test, point: prompt, expected: none,
     text: "rebase my branch onto main and resolve the conflicts"}
  - {id: neg-p12, split: cal, point: prompt, expected: none,
