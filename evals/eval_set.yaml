  - {id: repo-p8, split: cal, point: prompt, expected: repo-stats,
     text: "is this repo mostly go or rust, measured by lines of code"}
  - {id: repo-t1, split: test, point: tool, expected: repo-stats,
     text: "", tool_name: Bash,
     tool_input: {command: "wc -l src/**/*.ts | sort -n | tail -5"}}
  - {id: repo-t2, split: cal, point: tool, expected: repo-stats,
     text: "how large is this project, roughly", tool_name: Bash,
