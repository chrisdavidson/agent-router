     text: "which image does the web service use", tool_name: Bash,
     tool_input: {command: "yq '.services.web.image' docker-compose.yml"}}
  - {id: decoy-15, split: test, point: prompt, expected: none, decoy: true,
     text: "review this diff for bugs before I merge"}
  - {id: decoy-16, split: cal, point: tool, expected: none, decoy: true,
