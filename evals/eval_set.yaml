  - {id: decoy-9, split: test, point: prompt, expected: none, decoy: true,
     text: "run git commit -m 'fix typo' and push it"}
  - {id: decoy-10, split: cal, point: prompt, expected: none, decoy: true,
     text: "write release notes covering everything since v1.2"}
  - {id: decoy-11, split: test, point: skill, expected: none, decoy: true,
     text: "", tool_name: Skill,
     tool_input: {skill: "release-notes", args: "summarize all changes since v2.0 for the changelog"}}
  - {id: decoy-12, split: cal, point: tool, expected: none, decoy: true,
